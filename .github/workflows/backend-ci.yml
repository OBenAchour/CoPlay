name: Backend CI

on:
  push:
    paths:
      - 'Coplaybackend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'Coplaybackend/**'

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test
        working-directory: Coplaybackend
        run: mvn verify -B

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/coplay-backend:${{ github.sha }} ./Coplaybackend

      - name: Push to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/coplay-backend:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/coplay-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/coplay-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/coplay-backend:latest
