<div class="admin-container">
  <div class="admin-card">
    <div class="admin-header">
      <h2><i class="fas fa-users-cog"></i> Gestion des Utilisateurs</h2>
      <p class="error-banner" *ngIf="errorMessage">{{ errorMessage }}</p>
    </div>

    <div class="table-responsive" *ngIf="!errorMessage">
      <table class="user-table">
        <thead>
          <tr>
            <th>Nom</th>
            <th>Email</th>
            <th>Rôle</th>
            <th class="text-center">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of users">
            <td class="user-name">{{ user.profile?.displayName || 'Sans nom' }}</td>
            <td class="user-email">{{ user.email }}</td>
            <td>
              <span class="badge" [ngClass]="user.role === 'ADMIN' ? 'badge-admin' : 'badge-player'">
                {{ user.role }}
              </span>
            </td>
            <td class="actions-cell">
              <button (click)="editUser(user)" class="btn-edit">
                <i class="fas fa-edit"></i> Modifier
              </button>
              <button (click)="resetPassword(user)" class="btn-reset" title="Réinitialiser le mot de passe">
                 <i class="fas fa-key"></i>
                </button>
              <button (click)="deleteUser(user.userId)" class="btn-delete">
                <i class="fas fa-trash"></i> Supprimer
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="selectedUser">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Modifier l'utilisateur</h3>
      <button class="close-modal" (click)="selectedUser = null">&times;</button>
    </div>
    
    <div class="modal-body">
      <div class="form-group">
        <label>Nom d'affichage :</label>
        <input [(ngModel)]="selectedUser.profile!.displayName" class="form-control" placeholder="Entrez le nom">
      </div>

      <div class="form-group">
        <label>Rôle :</label>
        <select [(ngModel)]="selectedUser.role" class="form-control">
          <option value="PLAYER">PLAYER</option>
          <option value="ADMIN">ADMIN</option>
        </select>
      </div>

      <div class="form-group">
        <label>Statut :</label>
        <select [(ngModel)]="selectedUser.isActive" class="form-control">
          <option [ngValue]="true">Actif</option>
          <option [ngValue]="false">Bloqué</option>
        </select>
      </div>
    </div>

    <div class="modal-actions">
      <button (click)="selectedUser = null" class="btn-cancel">Annuler</button>
      <button (click)="saveChanges()" class="btn-save">Enregistrer</button>
    </div>
  </div>
</div>
