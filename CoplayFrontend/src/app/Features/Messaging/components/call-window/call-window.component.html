<div class="call-window" [class.video]="callType === 'VIDEO'">
  <div class="call-header">
    <span>{{ callType === 'VIDEO' ? '📹' : '📞' }}</span>
    <span>{{ callType === 'VIDEO' ? 'Appel vidéo' : 'Appel audio' }}</span>
    <span class="status">{{ getStatusText() }}</span>
  </div>

  <div class="call-body">
    <div class="avatar">👤</div>
    <div class="status-indicator" [class.ringing]="callStatus === 'ringing'">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <div class="call-controls">
    <button (click)="toggleMute()" [class.active]="isMuted">
      {{ isMuted ? '🔇' : '🔊' }}
    </button>
    <button *ngIf="callType === 'VIDEO'" (click)="toggleVideo()" [class.active]="isVideoOff">
      {{ isVideoOff ? '📵' : '📹' }}
    </button>
    <button class="end-call" (click)="isIncoming ? decline() : endCallEvent()">
      📞
    </button>
  </div>
</div>
