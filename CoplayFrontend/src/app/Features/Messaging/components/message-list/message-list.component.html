<div class="messages-container" #messagesContainer>
  <ng-container *ngFor="let group of messageGroups; trackBy: trackByDate">
    <div class="date-separator">
      <span>{{ group.label }}</span>
    </div>
    <div
      *ngFor="let message of group.messages; trackBy: trackByMessageId"
      class="message-wrapper"
      [class.my-message]="isMyMessage(message.sender?.email || '')">
      <app-message-bubble
        [message]="message"
        [isOwn]="isMyMessage(message.sender?.email || '')">
      </app-message-bubble>
    </div>
  </ng-container>
</div>
