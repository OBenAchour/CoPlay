<div class="profile-container" *ngIf="user">
  <div class="profile-card">
    <h2 class="profile-title">Mon Profil CoPlay</h2>

    <div class="profile-content">
      <div class="avatar-sidebar">
        <div class="image-wrapper">
          <img [src]="user.profile?.profilePicture || 'assets/default-avatar.png'" alt="Photo de profil" class="profile-img">
          <label for="fileInput" class="upload-badge">
            <i class="fas fa-camera"></i>
          </label>
        </div>
        <input type="file" (change)="onFileSelected($event)" accept="image/*" id="fileInput" hidden>
        <p class="avatar-hint">Modifier la photo</p>
      </div>

      <div class="profile-form">

        <div class="input-group">
          <label>Email professionnel</label>
          <input [value]="user.email" disabled class="form-control readonly" autocomplete="off" name="user_email_readonly">
        </div>

        <div class="form-row">
          <div class="input-group">
            <label>Nom d'affichage</label>
            <input [(ngModel)]="user.profile.displayName" class="form-control" placeholder="Votre pseudo" name="displayName" autocomplete="off">
          </div>
          <div class="input-group">
            <label>Téléphone</label>
            <input [(ngModel)]="user.profile.phone" class="form-control" placeholder="25 471 173" name="phone" autocomplete="off">
          </div>
        </div>

        <div class="input-group">
          <label>Ville actuelle</label>
          <input [(ngModel)]="user.profile.city" class="form-control" placeholder="Ariena, Tunis..." name="city" autocomplete="off">
        </div>

        <button (click)="saveProfile()" class="btn-primary">
          Enregistrer les modifications
        </button>
        <p class="success-msg" *ngIf="message">{{ message }}</p>

        <hr class="separator">

        <div class="password-toggle-zone">
          <button type="button" (click)="showPwForm = !showPwForm" class="btn-link">
            <i class="fas fa-key"></i>
            {{ showPwForm ? 'Masquer le changement de mot de passe' : 'Modifier mon mot de passe' }}
          </button>
        </div>

        <div class="pw-card" *ngIf="showPwForm">
          <div class="input-group">
            <label>Mot de passe actuel</label>
            <!-- ✅ current-password pour l'ancien mot de passe -->
            <input type="password"
                   [(ngModel)]="pwData.oldPassword"
                   class="form-control"
                   name="current-password-field"
                   autocomplete="current-password">
          </div>

          <div class="input-group">
            <label>Nouveau mot de passe</label>
            <!-- ✅ new-password pour le nouveau -->
            <input type="password"
                   [(ngModel)]="pwData.newPassword"
                   class="form-control"
                   name="new-password-field"
                   autocomplete="new-password">
          </div>

          <div class="input-group">
            <label>Confirmer le nouveau</label>
            <!-- ✅ new-password pour la confirmation -->
            <input type="password"
                   [(ngModel)]="pwData.confirmPassword"
                   class="form-control"
                   name="confirm-password-field"
                   autocomplete="new-password">
          </div>

          <p class="error-msg" *ngIf="pwError">{{ pwError }}</p>

          <div class="pw-actions">
            <button (click)="updatePassword()" class="btn-save-alt">Valider le changement</button>
            <button type="button" (click)="cancelPasswordChange()" class="btn-cancel">Annuler</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
