<div class="dashboard-container">
  <header class="welcome-section">
    <h1>Ravi de vous revoir, {{ userName }} ! ⚽</h1>
    <p>Prêt pour votre prochaine partie de sport ?</p>
  </header>

  <!-- Section Marketplace -->
  <div class="marketplace-section">
    <h2 class="section-title">🛍️ Marketplace</h2>
    <div class="marketplace-buttons">
      <button routerLink="/marketplace" class="marketplace-btn marketplace-btn-browse">
        <span class="btn-icon">🔍</span>
        <span class="btn-text">Voir les annonces</span>
      </button>
      <button routerLink="/marketplace/create" class="marketplace-btn marketplace-btn-create">
        <span class="btn-icon">➕</span>
        <span class="btn-text">Créer une annonce</span>
      </button>
      <button routerLink="/marketplace/my-listings" class="marketplace-btn marketplace-btn-my">
        <span class="btn-icon">📋</span>
        <span class="btn-text">Mes annonces</span>
      </button>
    </div>
  </div>

  <div class="stats-grid">
    <div class="card">
      <h3>Mes Matchs</h3>
      <p>Vous n'avez pas de match prévu.</p>
      <button class="btn-primary">Trouver une partie</button>
    </div>

    <div class="card">
      <h3>Mon Niveau</h3>
      <span class="badge">Intermédiaire</span>
    </div>

    <div class="card">
      <h3>Communauté</h3>
      <p>3 joueurs sont disponibles dans votre ville.</p>
    </div>
  </div>
</div>
