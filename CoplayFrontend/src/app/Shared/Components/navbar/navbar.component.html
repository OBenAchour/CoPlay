<header class="hdr" *ngIf="authService.isLoggedIn(); else loggedOut">

  <!-- LOGO (styles définis dans styles.css global) -->
  <a class="hdr-logo" routerLink="/dashboard">
    <span class="hdr-logo-dot">CP</span>
    <span>CoPlay</span>
  </a>

  <!-- NAVIGATION -->
  <nav class="hdr-nav">
    <a routerLink="/profile"      routerLinkActive="active">Mon Profil</a>
    <a routerLink="/dashboard"    routerLinkActive="active">Tableau de bord</a>

    <!-- Dropdown Événements & Entraînements -->
    <div class="evt-drop" [class.evt-open]="isEventsDropdownOpen">
      <button class="evt-trigger" (click)="toggleEventsDropdown()">
        Événements &amp; Entraînements
        <svg class="evt-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <ul class="evt-menu">
        <li><a routerLink="/events"            routerLinkActive="active" (click)="closeEventsDropdown()">📅 Événements</a></li>
        <li><a routerLink="/training-programs" routerLinkActive="active" (click)="closeEventsDropdown()">📋 Programmes d'entraînement</a></li>
        <li><a routerLink="/training-sessions" routerLinkActive="active" (click)="closeEventsDropdown()">🏃 Séances d'entraînement</a></li>
      </ul>
    </div>

    <a routerLink="/feed"         routerLinkActive="active">Feed</a>
    <a routerLink="/competitions" routerLinkActive="active">Compétitions</a>
    <a routerLink="/classement"   routerLinkActive="active">Classement</a>
    <a routerLink="/matchs"       routerLinkActive="active">Matchs</a>
    <a routerLink="/statistics"   routerLinkActive="active">Statistiques</a>
    <a routerLink="/my-tickets"   routerLinkActive="active">🎟️ Mes Billets</a>
    <a routerLink="/marketplace"  routerLinkActive="active">Marketplace</a>
    <a routerLink="/coaching"     routerLinkActive="active">Coaching</a>
    <a routerLink="/planning"     routerLinkActive="active">Planning</a>

    <a *ngIf="authService.isAdmin()" routerLink="/admin/reclamations" routerLinkActive="active" class="nav-admin">Réclamations</a>
    <a *ngIf="authService.isAdmin()" routerLink="/admin/users"        routerLinkActive="active" class="nav-admin">Utilisateurs</a>
  </nav>

  <!-- ZONE UTILISATEUR -->
  <div class="hdr-right">
    <ng-container *ngIf="authService.isLoggedIn(); else authButtons">
      <span class="hdr-greet">Bienvenue, <b>{{ authService.getUserName() }}</b></span>
      <button (click)="onLogout()" class="btn-logout">Déconnexion</button>
    </ng-container>
    <ng-template #authButtons>
      <button *ngIf="router.url !== '/'" routerLink="/login" class="btn-cp btn-primary-cp">Connexion</button>
    </ng-template>
  </div>

</header>

<!-- HEADER NON CONNECTÉ -->
<ng-template #loggedOut>
  <header class="hdr" style="grid-template-columns: auto 1fr auto">
    <a class="hdr-logo" routerLink="/">
      <span class="hdr-logo-dot">CP</span>
      <span>CoPlay</span>
    </a>
    <div></div>
    <button class="btn-cp btn-primary-cp" routerLink="/login">Connexion</button>
  </header>
</ng-template>
