<div class="orders-container">

  <header>
    <h1>📋 Mes commandes</h1>
    <div class="total">Total: <strong>{{ total() | number:'1.2-2' }} €</strong></div>
  </header>

  <div *ngIf="!userId" class="warning">Connectez-vous pour voir vos commandes.</div>

  <section class="card" *ngIf="userId">
    <div class="row">
      <select [(ngModel)]="filterStatus">
        <option value="">Tous statuts</option>
        <option value="PENDING">En attente</option>
        <option value="PAID">Payée</option>
        <option value="COMPLETED">Terminée</option>
        <option value="CANCELLED">Annulée</option>
      </select>
      <button (click)="load()" class="secondary">Rafraîchir</button>
    </div>
  </section>

  <div *ngIf="loading">Chargement...</div>

  <section class="card" *ngIf="!loading && userId">
    <table *ngIf="filtered().length > 0">
      <thead>
        <tr>
          <th>Date</th><th>Type</th><th>Cible</th><th>Montant</th><th>Statut</th><th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let o of filtered()">
          <td>{{ o.createdAt | date:'short' }}</td>
          <td><span class="type type-{{ o.targetType }}">{{ o.targetType }}</span></td>
          <td>{{ o.targetId }}</td>
          <td><strong>{{ o.amount | number:'1.2-2' }} €</strong></td>
          <td><span class="status status-{{ o.status }}">{{ o.status }}</span></td>
          <td>
            <button *ngIf="o.status === 'PENDING'" (click)="pay(o.orderId!)" class="success">Payer</button>
            <button *ngIf="o.status === 'PENDING'" (click)="cancel(o.orderId!)" class="danger">Annuler</button>
            <button *ngIf="o.status === 'PAID'" (click)="complete(o.orderId!)">Confirmer réception</button>
          </td>
        </tr>
      </tbody>
    </table>
    <p *ngIf="filtered().length === 0">Aucune commande.</p>
  </section>

</div>
