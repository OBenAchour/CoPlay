    // ═══════════════════════════════════════════════════════════════════
    //  CONSTANTS
    // ═══════════════════════════════════════════════════════════════════
    const CW  = 295;
    const LH  = 20;
    const HH  = 44;
    const SH  = 26;
    const SP  = 8;

    function boxH(attrs, methods) {
      return HH + SP * 2 + attrs.length * LH
        + (methods?.length ? SH + SP * 2 + methods.length * LH : 0);
    }

        attrs:['+reviewId : UUID','+authorId : UUID','+targetId : UUID',

               '+comment : String','+createdAt : DateTime'] },

    const BH = {};
    CLASSES.forEach(c => { BH[c.id] = boxH(c.attrs, c.methods); });

    function pt(id, side) {
      const c = CLASSES.find(x => x.id === id);
      const h = BH[id];
      const cx = c.x, cy = c.y;
      switch(side) {
        case 'T':  return [cx + CW*0.5,  cy];
        case 'B':  return [cx + CW*0.5,  cy + h];
        case 'L':  return [cx,           cy + h*0.5];
        case 'R':  return [cx + CW,      cy + h*0.5];
        case 'TL': return [cx + CW*0.25, cy];
        case 'TR': return [cx + CW*0.75, cy];
        case 'BL': return [cx + CW*0.25, cy + h];
        case 'BR': return [cx + CW*0.75, cy + h];
        default:   return [cx + CW*0.5,  cy + h*0.5];
      }
    }

      { from:'Tournoi',      fSide:'T',  to:'Competition',       tSide:'BL', label:'',               type:'inherit', col:'#ff7b72' },

    // ── SVG Components ──────────────────────────────────────────────

    function ClassBox({ cls }) {
      const mod = MOD[cls.mod];
      const h = BH[cls.id];
      const { x, y, attrs, methods, isEnum } = cls;
      const attrCol  = '#c9d1d9';
      const typeCol  = '#79c0ff';
      const enumCol  = mod.border;
      const mutedCol = '#8b949e';

      const rows = [];
      let cy = y;

      rows.push(
        <g key="hdr">
          <rect x={x} y={cy} width={CW} height={HH} fill={mod.border + '28'} />
          {isEnum && (
            <text x={x + CW/2} y={cy + 14} textAnchor="middle"
              fontSize={10} fill={mod.border} fontStyle="italic" fontFamily="'IBM Plex Mono',monospace">
              «enumeration»
            </text>
          )}
          {cls.isAbstract && (
            <text x={x + CW/2} y={cy + 14} textAnchor="middle"
              fontSize={10} fill={mod.border} fontStyle="italic" fontFamily="'IBM Plex Mono',monospace">
              «abstract»
            </text>
          )}
          <text x={x + CW/2} y={cy + (isEnum || cls.isAbstract ? 30 : 26)}
            textAnchor="middle" fontWeight="700"
            fontSize={isEnum ? 12 : 13} fill="#e6edf3"
            fontStyle={cls.isAbstract ? "italic" : "normal"}
            fontFamily="'IBM Plex Mono',monospace">
            {cls.id}
          </text>
        </g>
      );
      cy += HH;
      rows.push(<line key="sep0" x1={x} y1={cy} x2={x + CW} y2={cy} stroke={mod.border + '55'} strokeWidth={1} />);
      cy += SP;

      attrs.forEach((line, i) => {
        if (isEnum) {
          rows.push(
            <text key={`a${i}`} x={x + 12} y={cy + LH - 4}
              fontSize={12} fill={enumCol} fontFamily="'IBM Plex Mono',monospace" fontWeight="500">
              {line}
            </text>
          );
        } else {
          const colonIdx = line.indexOf(' : ');
          if (colonIdx > -1) {
            const np = line.substring(0, colonIdx);
            const tp = line.substring(colonIdx);
            rows.push(
              <text key={`a${i}`} x={x + 12} y={cy + LH - 4}
                fontSize={11.5} fontFamily="'IBM Plex Mono',monospace">
                <tspan fill={attrCol}>{np}</tspan>
                <tspan fill={typeCol}>{tp}</tspan>
              </text>
            );
          } else {
            rows.push(
              <text key={`a${i}`} x={x + 12} y={cy + LH - 4}
                fontSize={11.5} fill={attrCol} fontFamily="'IBM Plex Mono',monospace">
                {line}
              </text>
            );
          }
        }
        cy += LH;
      });
      cy += SP;

      if (methods?.length) {
        rows.push(<line key="sep1" x1={x} y1={cy} x2={x + CW} y2={cy} stroke={mod.border + '44'} strokeWidth={1} />);
        rows.push(<rect key="mhdr" x={x} y={cy} width={CW} height={SH} fill={mod.border + '14'} />);
        rows.push(
          <text key="mlbl" x={x + 10} y={cy + 17} fontSize={10} fill={mutedCol}
            fontStyle="italic" fontFamily="'IBM Plex Sans',sans-serif">methods</text>
        );
        cy += SH + SP;
        methods.forEach((m, i) => {
          rows.push(
            <text key={`m${i}`} x={x + 12} y={cy + LH - 4}
              fontSize={11.5} fill="#a5d6ff" fontFamily="'IBM Plex Mono',monospace">{m}</text>
          );
          cy += LH;
        });
      }

      return (
        <g>
          <rect x={x+4} y={y+4} width={CW} height={h} rx={7} fill="#000" opacity={0.25} />
          <rect x={x} y={y} width={CW} height={h} rx={7} fill={mod.bg} stroke={mod.border} strokeWidth={1.5} />
          {rows}
        </g>
      );
    }

    function RelLine({ rel }) {
      const [x1, y1] = pt(rel.from, rel.fSide);
      const [x2, y2] = pt(rel.to,   rel.tSide);
      const mx = (x1 + x2) / 2;
      const my = (y1 + y2) / 2;
      const isDep     = rel.type === 'dep';
      const isComp    = rel.type === 'compose';
      const isInherit = rel.type === 'inherit';
      const hexId     = rel.col.replace('#','').substring(0,6);

      return (
        <g>
          <line x1={x1} y1={y1} x2={x2} y2={y2}
            stroke={rel.col} strokeWidth={isDep ? 1.2 : 1.6}
            strokeDasharray={isDep ? '5,4' : 'none'}
            markerEnd={isInherit ? `url(#inh-${hexId})` : `url(#arr-${hexId})`}
            opacity={isDep ? 0.55 : 0.85} />
          {isComp && (
            <polygon
              points={`${x1},${y1} ${x1-6},${y1-4} ${x1},${y1-8} ${x1+6},${y1-4}`}
              fill={rel.col} opacity={0.9}
              transform={`rotate(${Math.atan2(y2-y1,x2-x1)*180/Math.PI+90},${x1},${y1})`} />
          )}
          {rel.label && !isDep && !isInherit && (
            <text x={mx} y={my - 6} textAnchor="middle"
              fontSize={10} fill={rel.col} fontFamily="'IBM Plex Sans',sans-serif"
              fontWeight="600" opacity={0.9}>{rel.label}</text>
          )}
        </g>
      );
    }

    const MARKER_COLORS = [...new Set(RELS.map(r => r.col.replace('#','').substring(0,6)))];
    const INHERIT_COLORS = [...new Set(RELS.filter(r => r.type === 'inherit').map(r => r.col.replace('#','').substring(0,6)))];

    // ── Main App ───────────────────────────────────────────────────

    function App() {
      const [zoom, setZoom] = useState(0.32);
      const [pan,  setPan]  = useState({ x: 20, y: 20 });
      const [dragging, setDragging] = useState(false);
      const [lastPt,   setLastPt]   = useState({ x: 0, y: 0 });
      const containerRef = useRef(null);
      const CANVAS_W = 3120, CANVAS_H = 2620;

      const onWheel = useCallback(e => {
        e.preventDefault();
        setZoom(z => Math.min(Math.max(z * (e.deltaY > 0 ? 0.92 : 1.08), 0.08), 5.0));
      }, []);

      const onMouseDown = useCallback(e => {
        setDragging(true);
        setLastPt({ x: e.clientX, y: e.clientY });
      }, []);

      const onMouseMove = useCallback(e => {
        if (!dragging) return;
        setPan(p => ({ x: p.x + e.clientX - lastPt.x, y: p.y + e.clientY - lastPt.y }));
        setLastPt({ x: e.clientX, y: e.clientY });
      }, [dragging, lastPt]);

      const onMouseUp = useCallback(() => setDragging(false), []);

      useEffect(() => {
        const el = containerRef.current;
        if (el) el.addEventListener('wheel', onWheel, { passive: false });
        return () => { if (el) el.removeEventListener('wheel', onWheel); };
      }, [onWheel]);

      const btnStyle = {
        background:'#21262d', border:'1px solid #30363d', color:'#e6edf3',
        padding:'5px 13px', borderRadius:6, cursor:'pointer',
        fontSize:14, fontFamily:"'IBM Plex Sans',sans-serif", fontWeight:700
      };

      return (
        <div style={{ background:'#0d1117', height:'100vh', display:'flex', flexDirection:'column', fontFamily:"'IBM Plex Sans',sans-serif" }}>

          {/* Header */}
          <div style={{ background:'#161b22', borderBottom:'1px solid #30363d', padding:'12px 24px',
            display:'flex', alignItems:'center', gap:14, flexShrink:0, flexWrap:'wrap' }}>
            <div style={{ width:38, height:38, background:'linear-gradient(135deg,#58a6ff,#bc8cff)',
              borderRadius:9, display:'flex', alignItems:'center', justifyContent:'center', fontSize:20 }}>⚽</div>
            <div>
              <div style={{ fontWeight:700, fontSize:15, color:'#e6edf3' }}>Sports Social Platform — Unified UML Class Diagram</div>
              <div style={{ fontSize:12, color:'#8b949e', marginTop:2 }}>7 modules · 40 classes · Scroll = zoom · Glisser = déplacer</div>
            </div>
            <div style={{ marginLeft:'auto', display:'flex', alignItems:'center', gap:6 }}>
              <button style={btnStyle} onClick={() => setZoom(z => Math.min(z * 1.3, 5))}>＋</button>
              <button style={btnStyle} onClick={() => setZoom(z => Math.max(z * 0.77, 0.08))}>－</button>
              <button style={btnStyle} onClick={() => { setZoom(0.32); setPan({ x:20, y:20 }); }}>⊡ Vue globale</button>
              <button style={btnStyle} onClick={() => { setZoom(1.0);  setPan({ x:20, y:20 }); }}>1:1 Détail</button>
              <span style={{ color:'#8b949e', fontSize:12, marginLeft:6 }}>{Math.round(zoom*100)}%</span>
            </div>
          </div>

          {/* Legend */}
          <div style={{ background:'#161b22', borderBottom:'1px solid #30363d', padding:'8px 24px',
            display:'flex', gap:16, flexWrap:'wrap' }}>
            {Object.entries(MOD).map(([k, v]) => (
              <div key={k} style={{ display:'flex', alignItems:'center', gap:6, fontSize:11 }}>
                <div style={{ width:10, height:10, borderRadius:2, background:v.border }}/>
                <span style={{ color:'#8b949e' }}>{v.title}</span>
              </div>
            ))}
          </div>

          {/* Canvas */}
          <div ref={containerRef}
            style={{ flex:1, overflow:'hidden', cursor: dragging ? 'grabbing' : 'grab' }}
            onMouseDown={onMouseDown} onMouseMove={onMouseMove}
            onMouseUp={onMouseUp} onMouseLeave={onMouseUp}>
            <svg width={CANVAS_W} height={CANVAS_H}
              style={{ transform:`translate(${pan.x}px,${pan.y}px) scale(${zoom})`, transformOrigin:'0 0', display:'block' }}>

              <defs>
                {MARKER_COLORS.map(hex => (
                  <marker key={hex} id={`arr-${hex}`} markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L8,3 z" fill={`#${hex}`} opacity="0.85" />
                  </marker>
                ))}
                {INHERIT_COLORS.map(hex => (
                  <marker key={`inh-${hex}`} id={`inh-${hex}`} markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto">
                    <path d="M0,0 L12,6 L0,12 Z" fill="none" stroke={`#${hex}`} strokeWidth="1.8" opacity="0.9" />
                  </marker>
                ))}
                <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                  <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff08" strokeWidth="0.5"/>
                </pattern>
              </defs>

              <rect width={CANVAS_W} height={CANVAS_H} fill="#0d1117" />
              <rect width={CANVAS_W} height={CANVAS_H} fill="url(#grid)" />

              {/* Module containers */}
              {MODULE_BOXES.map(mb => {
                const m = MOD[mb.mod];
                return (
                  <g key={mb.mod}>
                    <rect x={mb.x} y={mb.y} width={mb.w} height={mb.h} rx={12}
                      fill={m.bg} stroke={m.border} strokeWidth={1.5} strokeDasharray="6,4" opacity={0.85} />
                    <rect x={mb.x} y={mb.y} width={mb.w} height={28} rx={12} fill={m.border + '22'} />
                    <rect x={mb.x} y={mb.y+14} width={mb.w} height={14} fill={m.border + '22'} />
                    <text x={mb.x + mb.w/2} y={mb.y + 19} textAnchor="middle"
                      fontSize={12} fontWeight="700" fill={m.border}
                      fontFamily="'IBM Plex Sans',sans-serif" letterSpacing="0.5">
                      {m.title}
                    </text>
                  </g>
                );
              })}

              {/* Relations */}
              {RELS.map((r, i) => <RelLine key={i} rel={r} />)}

              {/* Classes */}
              {CLASSES.map(c => <ClassBox key={c.id} cls={c} />)}
            </svg>
          </div>

          {/* Footer */}
          <div style={{ background:'#161b22', borderTop:'1px solid #30363d',
            padding:'7px 24px', fontSize:11, color:'#8b949e',
            display:'flex', justifyContent:'space-between', flexWrap:'wrap', gap:8, flexShrink:0 }}>
            <span>🖱 Molette = zoom · Clic + glisser = déplacer · ⊡ = vue d'ensemble · 1:1 = plein détail</span>
            <span>
              <span style={{color:'#58a6ff'}}>━▶</span> Association &nbsp;
              <span style={{color:'#bc8cff'}}>━━◆</span> Composition &nbsp;
              <span style={{color:'#8b949e'}}>╌╌▶</span> Dépendance &nbsp;
              <span style={{color:'#ff7b72'}}>━△</span> Héritage
            </span>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
